[project]
name = "boundrelay"
version = "0.0.1"
description = "Error-bounded GPU compression for intermediate-state transport in multi-stage LLM inference"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.4",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-xdist>=3.5"]
plot = ["matplotlib>=3.8"]
# Installed only on the rented CUDA boxes, never on the Mac.
gpu = ["triton>=3.0"]
# Quality lane: KV-cache perplexity sweep (Phase 3, D20).
eval = ["transformers>=4.44", "datasets>=2.20"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["boundrelay"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: requires CUDA; skipped on the Mac",
    "slow: full sweeps, not part of the smoke suite",
]
